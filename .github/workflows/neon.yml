name: Neon

# Handgeschriebene Migration gegen Neon anwenden — ausschließlich manuell.
# Der Lauf zeigt die ausgewählte Datei im Protokoll und verlangt zusätzlich das
# Wort "anwenden". Damit bleibt Schemaänderung ein eigener, sichtbarer Schritt.

on:
  workflow_dispatch:
    inputs:
      datei:
        description: "Welche Migration?"
        required: true
        type: choice
        default: "004_connector_hub.sql"
        options:
          - "004_connector_hub.sql"
          - "003_control_plane.sql"
          - "002_protokoll_inhalt.sql"
          - "001_grundschema.sql"
      wirklich:
        description: 'Zum Anwenden "anwenden" eintippen. Alles andere ist ein Trockenlauf.'
        required: true
        default: "trocken"

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Schema und DB-Logik prüfen
        run: npx vitest run db

      - name: Trockenlauf
        if: inputs.wirklich != 'anwenden'
        run: |
          npm run migrieren:trocken -- --datei="${{ inputs.datei }}"
          echo "Nichts gesendet. Zum Anwenden den Lauf mit \"anwenden\" starten."
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ secrets.NEON_DATABASE }}
          NEON_ROLE: ${{ secrets.NEON_ROLE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Anwenden
        if: inputs.wirklich == 'anwenden'
        run: npm run migrieren -- --datei="${{ inputs.datei }}"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ secrets.NEON_DATABASE }}
          NEON_ROLE: ${{ secrets.NEON_ROLE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
