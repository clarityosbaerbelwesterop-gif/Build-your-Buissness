name: BYB Pre-Stripe Unpaid Surface Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prestripe-surface-smoke.yml

permissions:
  contents: read

concurrency:
  group: byb-prestripe-unpaid-surface
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_5KyyWAPW9vLU4EiaKaYZuhaG
      VERCEL_PROJECT_ID: prj_VB7ToSJE6spWofEKZRjVyC0d6rOL
      BYB_URL: https://build-your-buissness.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment authority
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 1
          fi
          echo "Vercel deployment authority configured."

      - name: Enable unpaid Surface on production
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn '{key:"BYB_ALLOW_UNPAID_SURFACE",value:"1",type:"plain",target:["production"],comment:"Pre-Stripe unpaid Surface product check"}')"
          code="$(curl --silent --show-error --output /tmp/vercel-env.json --write-out '%{http_code}'             --request POST             --url "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID"             --header "Authorization: Bearer $VERCEL_TOKEN"             --header "Content-Type: application/json"             --data "$payload")"
          case "$code" in
            200|201) echo "BYB_ALLOW_UNPAID_SURFACE enabled for production." ;;
            *)
              echo "Vercel environment update failed (HTTP $code)."
              jq -r '.error.code // .error.message // "unknown"' /tmp/vercel-env.json 2>/dev/null || true
              exit 1
              ;;
          esac

      - name: Trigger production deployment from main
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn             --arg name "byb-prestripe-${GITHUB_RUN_ID}"             --arg project "$VERCEL_PROJECT_ID"             --arg ref "$GITHUB_SHA"             '{name:$name,project:$project,target:"production",gitSource:{type:"github",ref:$ref,repoId:"1341551962"}}')"
          code="$(curl --silent --show-error --output /tmp/vercel-deploy.json --write-out '%{http_code}'             --request POST             --url "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID"             --header "Authorization: Bearer $VERCEL_TOKEN"             --header "Content-Type: application/json"             --data "$payload")"
          case "$code" in
            200|201) ;;
            *)
              echo "Vercel production deployment creation failed (HTTP $code)."
              jq -r '.error.code // .error.message // "unknown"' /tmp/vercel-deploy.json 2>/dev/null || true
              exit 1
              ;;
          esac
          deployment_id="$(jq -r '.id // empty' /tmp/vercel-deploy.json)"
          if [ -z "$deployment_id" ]; then
            echo "Vercel did not return a deployment id."
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_ENV"

      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error               --header "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_ORG_ID"               > /tmp/vercel-status.json
            state="$(jq -r '.readyState // .status // empty' /tmp/vercel-status.json)"
            url="$(jq -r '.url // empty' /tmp/vercel-status.json)"
            if [ "$state" = "READY" ]; then
              echo "Production READY: https://$url"
              {
                echo "### BYB pre-Stripe deployment"
                echo "- Canonical: $BYB_URL/surface.html"
                echo "- Deployment: https://$url"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              echo "Vercel deployment ended with $state."
              exit 1
            fi
            echo "Deployment not ready yet ($state, attempt $attempt/30)."
            sleep 5
          done
          echo "Vercel production deployment did not become READY."
          exit 1

      - name: Wait for anonymous Surface API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 20               --output /tmp/surface-get.json --write-out '%{http_code}'               "$BYB_URL/api/surface" || true)"
            if [ "$code" = "200" ]; then
              echo "Anonymous GET /api/surface passed."
              exit 0
            fi
            echo "Surface not ready yet (HTTP $code, attempt $attempt/24)."
            sleep 5
          done
          cat /tmp/surface-get.json 2>/dev/null || true
          exit 1

      - name: Smoke idea to lead without login
        shell: bash
        run: |
          set -euo pipefail

          idea_payload="$(jq -cn '{idee:"Pre-Stripe Smoke: Beratungsangebot fuer kleine Unternehmen mit klarer Landingpage und Lead-Capture."}')"
          create_code="$(curl --silent --show-error --max-time 30             --output /tmp/surface-create.json --write-out '%{http_code}'             -X POST "$BYB_URL/api/surface"             -H 'content-type: application/json'             -H 'accept: application/json'             --data "$idea_payload")"
          case "$create_code" in
            2??) ;;
            *)
              echo "Anonymous POST /api/surface failed (HTTP $create_code)."
              cat /tmp/surface-create.json
              exit 1
              ;;
          esac

          auftrag_id="$(jq -r '.lauf.auftrag_id // empty' /tmp/surface-create.json)"
          if [ -z "$auftrag_id" ]; then
            echo "Surface response did not return lauf.auftrag_id."
            cat /tmp/surface-create.json
            exit 1
          fi

          lead_payload="$(jq -cn --arg id "$auftrag_id"             '{auftragId:$id,name:"Pre-Stripe Smoke",email:"prestripe-smoke@example.invalid",nachricht:"Automatischer Pre-Stripe Lead-Smoke. Kein echter Kunde."}')"
          lead_code="$(curl --silent --show-error --max-time 30             --output /tmp/surface-lead.json --write-out '%{http_code}'             -X POST "$BYB_URL/api/surface-leads"             -H 'content-type: application/json'             -H 'accept: application/json'             --data "$lead_payload")"
          case "$lead_code" in
            2??) echo "Anonymous POST /api/surface-leads passed." ;;
            *)
              echo "Anonymous POST /api/surface-leads failed (HTTP $lead_code)."
              cat /tmp/surface-lead.json
              exit 1
              ;;
          esac

          protected_code="$(curl --silent --show-error --max-time 20             --output /tmp/auftraege.json --write-out '%{http_code}'             "$BYB_URL/api/auftraege" || true)"
          if [ "$protected_code" != "401" ]; then
            echo "Protected /api/auftraege must stay 401 without auth; got HTTP $protected_code."
            cat /tmp/auftraege.json
            exit 1
          fi

          echo "BYB pre-Stripe smoke PASS: idea -> stored Surface -> stored lead; protected app API remains closed."
          {
            echo "- Anonymous Surface GET: PASS"
            echo "- Anonymous idea POST: PASS"
            echo "- Anonymous lead POST: PASS"
            echo "- Protected /api/auftraege without token: 401 PASS"
          } >> "$GITHUB_STEP_SUMMARY"
