name: Geheimnisse

# CLAUDE.md §2.4: "Ein Key im Diff ist ein Abbruchgrund."
#
# Dieser Wächter hat einmal versagt und der Grund steht hier, damit er nicht
# noch einmal so zugeschnitten wird: er lief **nur** bei `pull_request`. Drei
# Commits gingen direkt auf main, jeder mit einem echten Schlüssel in einer
# .env — und der Wächter hat sie nie gesehen. Ein Wächter, der nur den
# höflichen Weg bewacht, bewacht nichts.
#
# Zwei Prüfungen, und die zweite ist die wichtigere:
#
# 1. Neue Zeilen eines PR auf Schlüsselmuster.
# 2. Der **ganze Baum** auf eine vorhandene .env — bei jedem Push, auch auf
#    main. Muster können sich ändern; eine .env im Repo ist immer falsch.

on:
  pull_request:
  push:

jobs:
  keine-env-datei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liegt eine .env im Repo?
        run: |
          set -euo pipefail
          # `git ls-files` statt `ls`: es geht um das, was versioniert ist.
          GEFUNDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$GEFUNDEN" ]; then
            echo "Eine .env liegt im Repository:"
            echo "$GEFUNDEN"
            echo
            echo "Werte gehoeren in die GitHub Secrets."
            echo "Settings -> Secrets and variables -> Actions"
            echo
            echo "Wichtig: die Datei zu loeschen genuegt nicht. Was einmal"
            echo "committet wurde, steht im Verlauf. Jeder Schluessel darin"
            echo "muss beim Anbieter widerrufen und neu ausgestellt werden."
            exit 1
          fi
          echo "Keine .env im Repository."

  keine-keys-im-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neue Zeilen auf Zugangsdaten pruefen
        run: |
          set -euo pipefail
          BASIS="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          # Bewusst wenige, praezise Muster. Eine lange Liste vager Ausdruecke
          # erzeugt Fehlalarme, und ein Waechter, dem niemand glaubt, wird
          # uebergangen.
          MUSTER='sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|napi_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|postgres(ql)?://[^:]+:[^@[:space:]]+@'

          # Testdateien und Beispiele sind ausgenommen — dort stehen Attrappen.
          # Der Angreifer im Produkt (attackers/zugangsdaten.ts, NUR_BEISPIEL)
          # kennt diese Ausnahme seit dem ersten Tag; dieser Waechter kannte sie
          # nicht und hat prompt einen Testwert gemeldet. Zwei Pruefungen fuer
          # dieselbe Frage, von denen eine die Regel kennt und die andere nicht,
          # sind schlimmer als eine: die strengere gilt am Ende als kaputt.
          #
          # Dateiweise statt ueber den ganzen Diff, weil `git diff` den
          # Dateinamen nur in der +++-Zeile nennt und nicht je Treffer.
          GEFUNDEN=0
          while IFS= read -r DATEI; do
            [ -z "$DATEI" ] && continue
            case "$DATEI" in
              *.test.ts|*.test.tsx|*.spec.ts|*.spec.tsx|*.example|*.example.*|*.sample|*.sample.*)
                continue ;;
            esac
            NEU=$(git diff "$BASIS"...HEAD --unified=0 -- "$DATEI" \
                  | grep '^+' | grep -v '^+++' || true)
            if echo "$NEU" | grep -Eq "$MUSTER"; then
              # Nur der Dateiname, nie der Wert — dieses Protokoll ist fuer
              # jeden lesbar, der Zugriff auf das Repository hat.
              echo "  $DATEI"
              GEFUNDEN=1
            fi
          done < <(git diff --name-only "$BASIS"...HEAD)

          if [ "$GEFUNDEN" -eq 1 ]; then
            echo
            echo "Zugangsdaten in den neuen Zeilen der oben genannten Dateien."
            echo "Keys gehoeren in GitHub Secrets, nicht in den Quelltext."
            exit 1
          fi
          echo "Keine Zugangsdaten in den neuen Zeilen."
