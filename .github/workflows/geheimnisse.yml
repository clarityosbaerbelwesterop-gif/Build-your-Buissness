name: Geheimnisse

# CLAUDE.md §2.4: "Ein Key im Diff ist ein Abbruchgrund."
#
# Dieser Wächter hat einmal versagt und der Grund steht hier, damit er nicht
# noch einmal so zugeschnitten wird: er lief **nur** bei `pull_request`. Drei
# Commits gingen direkt auf main, jeder mit einem echten Schlüssel in einer
# .env — und der Wächter hat sie nie gesehen. Ein Wächter, der nur den
# höflichen Weg bewacht, bewacht nichts.
#
# Zwei Prüfungen:
#
# 1. Der **ganze Baum** auf eine vorhandene .env — bei jedem Push, auch auf
#    main. Eine .env im Repo ist unabhängig vom Inhalt falsch.
# 2. Geänderte Dateien eines PRs werden dem **gleichen Angreifer** gegeben, den
#    das Produkt benutzt (`attackers/zugangsdaten.ts`). Die Schlüsselmuster und
#    Ausnahmen stehen damit nicht mehr doppelt in CI und Produkt.

on:
  pull_request:
  push:

jobs:
  keine-env-datei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liegt eine .env im Repo?
        run: |
          set -euo pipefail
          # `git ls-files` statt `ls`: es geht um das, was versioniert ist.
          GEFUNDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$GEFUNDEN" ]; then
            echo "Eine .env liegt im Repository:"
            echo "$GEFUNDEN"
            echo
            echo "Werte gehoeren in die GitHub Secrets."
            echo "Settings -> Secrets and variables -> Actions"
            echo
            echo "Wichtig: die Datei zu loeschen genuegt nicht. Was einmal"
            echo "committet wurde, steht im Verlauf. Jeder Schluessel darin"
            echo "muss beim Anbieter widerrufen und neu ausgestellt werden."
            exit 1
          fi
          echo "Keine .env im Repository."

  keine-keys-im-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Geänderte Dateien mit Produkt-Angreifer prüfen
        run: |
          set -euo pipefail
          BASIS="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          npx tsx attackers/zugangsdaten-ci.ts "$BASIS"
