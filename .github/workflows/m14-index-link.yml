name: M1.4 Login-Link Einmalig

on:
  push:
    branches:
      - m14-user-auth-e2e
    paths:
      - .github/workflows/m14-index-link.yml

permissions:
  contents: write

jobs:
  login-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m14-user-auth-e2e
      - name: Anmeldung in bestehende Oberfläche einhängen
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()
          old_nav = '<a class="button secondary" href="#leitstand">Vorschau öffnen</a>'
          new_nav = '<a class="button secondary" href="/login.html">Anmelden / Live-Test</a>'
          old_missing = "if(!token){show('Die Live-Vorschau ist sichtbar. Für einen echten Checkout braucht diese Browser-Session zuerst eine Neon-Auth-Anmeldung.');return}"
          new_missing = "if(!token){location.href='/login.html';return}"
          if text.count(old_nav) != 1:
              raise SystemExit("Navigation konnte nicht eindeutig aktualisiert werden")
          if text.count(old_missing) != 1:
              raise SystemExit("Checkout-Login-Grenze konnte nicht eindeutig aktualisiert werden")
          text = text.replace(old_nav, new_nav).replace(old_missing, new_missing)
          path.write_text(text)
          PY
      - name: Änderung committen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "M1.4: link first-party login from landing page"
          git push origin HEAD:m14-user-auth-e2e
