name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Pentest.md verlangt den Dependency-Check bei jedem Push/PR. Hohe und
      # kritische bekannte Schwachstellen blockieren den Schritt; moderate
      # bleiben sichtbar, ohne jede Entwicklung bei einer Dev-Dependency zu
      # stoppen.
      - name: Abhängigkeiten prüfen
        run: npm audit --audit-level=high

      # Welche Zugaenge liegen in den Secrets? Gibt nur Wahrheitswerte aus,
      # nie einen Wert — das Protokoll eines Laufs ist fuer jeden lesbar, der
      # Zugriff auf das Repository hat.
      #
      # Faerbt den Lauf NICHT rot, wenn etwas fehlt: in M0 braucht kein Schritt
      # einen Zugang. Ein Waechter, der bei jedem PR schreit, ohne dass jemand
      # etwas falsch gemacht hat, wird nach der dritten Meldung ignoriert.
      - name: Zugänge prüfen
        run: npm run zugaenge

      # Antworten die drei Modelle wirklich? Ein Aufruf je Modell mit einem
      # winzigen Auftrag — der guenstigste Beweis, dass ein Schluessel gilt und
      # das Modell unter der eingetragenen Kennung erreichbar ist.
      #
      # Nur auf main und bei Hand-Auslösung: bei jedem PR waeren das drei
      # Modellaufrufe je Push, und die kosten.
      - name: Rauchtest der Modelle
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: npm run rauchtest
    env:
      # Die Modell-Zugaenge werden hier durchgereicht, damit sie an genau einer
      # Stelle stehen. In M0 ruft nichts ein Modell — die Angreifer arbeiten
      # statisch auf dem Quelltext. Ab M1 braucht der LLM-gestuetzte Angreifer
      # sie, und dann muss niemand die Datei suchen.
      #
      # Was in den GitHub Secrets liegen muss, steht in STATUS.md.
      #
      # workflow_dispatch, damit der Rauchtest sich vom iPad aus anstoßen
      # lässt: Actions → CI → Run workflow.
      NV_API_KEY_1: ${{ secrets.NV_API_KEY_1 }}
      NV_API_KEY_2: ${{ secrets.NV_API_KEY_2 }}
      NV_API_KEY_3: ${{ secrets.NV_API_KEY_3 }}
      NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
