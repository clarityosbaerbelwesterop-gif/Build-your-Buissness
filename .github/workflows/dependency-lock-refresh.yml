name: Temporary dependency lock refresh

on:
  push:
    branches: [astra/byb-dependency-security]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[lock-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/byb-dependency-security
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild lockfile from patched dependency constraints
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.6.0
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh dependency lock [lock-refresh]"
          git push origin HEAD:astra/byb-dependency-security
