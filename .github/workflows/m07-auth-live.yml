name: M0.7 Neon-Auth-Livenachweis

on:
  pull_request:
    branches: [main]
    paths:
      - "auth/**"
      - ".github/workflows/m07-auth-live.yml"

jobs:
  nachweis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Echtes Provider-JWT ausstellen und mit M0.7 prüfen
        env:
          AUTH_BASE: https://ep-flat-bonus-b197w4rq.neonauth.c-5.eu-central-1.aws.neon.tech/neondb/auth
          JWKS_URL: https://ep-flat-bonus-b197w4rq.neonauth.c-5.eu-central-1.aws.neon.tech/neondb/auth/.well-known/jwks.json
        run: |
          set -euo pipefail
          ORIGIN="${AUTH_BASE%%/neondb/auth}"
          EMAIL="m07-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASS="$(openssl rand -hex 24)"

          SIGNUP="$(jq -nc --arg name 'M0.7 Nachweis' --arg email "$EMAIL" --arg password "$PASS" \
            '{name:$name,email:$email,password:$password}')"
          curl -fsS -o /dev/null \
            -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
            -X POST "$AUTH_BASE/sign-up/email" -d "$SIGNUP"

          SIGNIN="$(jq -nc --arg email "$EMAIL" --arg password "$PASS" \
            '{email:$email,password:$password,rememberMe:false}')"
          curl -fsS -c cookies.txt -o /dev/null \
            -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
            -X POST "$AUTH_BASE/sign-in/email" -d "$SIGNIN"

          curl -fsS -b cookies.txt -o token.json "$AUTH_BASE/token"
          TOKEN="$(jq -er '.token | strings | select(length > 20)' token.json)"

          NEON_AUTH_TEST_TOKEN="$TOKEN" node --input-type=module - <<'NODE'
          import { decodeJwt, decodeProtectedHeader } from "jose";
          const token = process.env.NEON_AUTH_TEST_TOKEN;
          if (token === undefined) throw new Error("Testtoken fehlt.");
          const payload = decodeJwt(token);
          const header = decodeProtectedHeader(token);
          console.error("Provider-Metadaten: " + JSON.stringify({
            alg: header.alg ?? null,
            iss: payload.iss ?? null,
            aud: payload.aud ?? null,
            hat_sub: typeof payload.sub === "string",
            hat_exp: typeof payload.exp === "number",
            hat_nbf: typeof payload.nbf === "number",
          }));
          NODE

          NEON_AUTH_TEST_TOKEN="$TOKEN" \
          NEON_AUTH_BASE_URL="$AUTH_BASE" \
          NEON_AUTH_JWKS_URL="$JWKS_URL" \
            npx tsx auth/neon-auth-nachweis.ts

          rm -f cookies.txt token.json
