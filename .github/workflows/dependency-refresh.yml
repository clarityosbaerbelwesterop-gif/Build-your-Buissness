name: Dependency-Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  vitest-aktualisieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m05-fixer-und-nachweise
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gepatchte Test-Abhaengigkeiten sauber aufloesen
        run: |
          set -euo pipefail
          npm pkg set devDependencies.vitest=4.1.10
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Lint
        run: npm run lint
      - name: Typpruefung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Abhaengigkeiten pruefen
        run: npm audit --audit-level=high

      - name: Lockfile zurueckschreiben
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung noetig."
            exit 0
          fi
          git commit -m "chore: aktualisiere Test-Abhaengigkeiten"
          git push origin HEAD:m05-fixer-und-nachweise
