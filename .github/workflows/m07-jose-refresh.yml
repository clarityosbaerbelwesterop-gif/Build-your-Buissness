name: M0.7 Dependency Refresh

on:
  push:
    branches: [m07-neon-auth-jwt]
    paths:
      - ".github/workflows/m07-jose-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m07-neon-auth-jwt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Lockfile mit jose 6.2.9 auflösen
        run: |
          npm pkg set dependencies.jose=6.2.9
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Unter Zielruntime prüfen
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm audit --audit-level=high
      - name: Lockfile zurück auf den Feature-Branch schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Keine Dependency-Änderung nötig."
          else
            git commit -m "chore: jose für M0.7 hinzufügen"
            git push origin HEAD:m07-neon-auth-jwt
          fi
